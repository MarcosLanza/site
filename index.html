<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertorio</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top, #1f2937, #0d1117);
}

/* FIX MOBILE SCROLL WHITE */

body {
  font-family: 'Segoe UI', sans-serif;
  color: #e6edf3;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: #0d1117;
}

body {
  position: fixed;
  width: 100%;
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  background: radial-gradient(circle at top, #1f2937, #0d1117);
}

/* contenedor */
.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
  min-height: 100vh;
}

/* header */
h1 {
  text-align: center;
  margin-bottom: 10px;
}

/* buscador */
#search {
  width: 100%;
  padding: 14px;
  margin: 15px 0;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  color: white;
}

/* filtros */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-btn {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  color: white;
  transition: 0.2s;
}

.active {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

/* títulos */
.section-title {
  margin: 20px 0 10px;
  font-size: 14px;
  padding: 6px 10px;
  border-radius: 10px;
  display: inline-block;
}

.lentas {
  background: rgba(59,130,246,0.15);
  color: #60a5fa;
}

.rapidas {
  background: rgba(245,158,11,0.15);
  color: #fbbf24;
}

/* cards */
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  padding: 10px;
  border-radius: 16px;
  margin-bottom: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.02);
}

.card.lenta {
  border-left: 3px solid #3b82f6;
}

.card.rapida {
  border-left: 3px solid #f59e0b;
}

/* imagen */
.thumb {
  width: 100px;
  height: 65px;
  border-radius: 10px;
  object-fit: cover;
}

/* info */
.info {
  flex: 1;
}

.title {
  font-weight: 600;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

/* botón */
button.play {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  padding: 10px;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

/* animación */
.playing {
  animation: pulse 0.6s ease;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* mobile */
@media (max-width: 600px) {
  .thumb {
    width: 80px;
    height: 55px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🎧 Repertorio Jóvenes</h1>

  <input id="search" placeholder="Buscar..." onkeyup="applyFilters()">

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('semanal', this)">🔥 Este Mes</button>
    <button class="filter-btn" onclick="setFilter('all', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('lenta', this)">🎶 Lentas</button>
    <button class="filter-btn" onclick="setFilter('rapida', this)">⚡ Rápidas</button>
  </div>

  <div id="list"></div>
</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6QgrmaVQhta8eiWVbG0Ts3DMnWaRfvgUyivmI-2Xrh2UyGgqWg02oC6jKXyOHX9DZsvDHls8oUb8d/pub?gid=0&single=true&output=csv";

let songs = [];
let currentFilter = "semanal";

fetch(URL)
  .then(res => res.text())
  .then(data => {
    const rows = data.split("\n").slice(1);

    songs = rows.map(row => {
      const [name, link, tono, tipo, ra] = row.split(",");

      return {
        name,
        link,
        tono,
        tipo: (tipo || "").trim() === "1" ? "lenta" :
              (tipo || "").trim() === "2" ? "rapida" : "",
        ra: (ra || "").trim() === "1"
      };
    }).filter(s => s.name);

    applyFilters();
  });

function getYouTubeID(url) {
  const regExp = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const match = url.match(regExp);
  return match ? match[1] : null;
}

function getThumbnail(url) {
  const id = getYouTubeID(url);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}

function playSong(link, btn) {
  btn.classList.add("playing");
  setTimeout(() => btn.classList.remove("playing"), 600);
  window.open(link);
}

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (currentFilter === "semanal") {
    const lentas = data.filter(s => s.tipo === "lenta");
    const rapidas = data.filter(s => s.tipo === "rapida");

    if (lentas.length) {
      list.innerHTML += `<div class="section-title lentas">🎶 Lentas</div>`;
      lentas.forEach((s, i) => list.innerHTML += cardHTML(s, i+1));
    }

    if (rapidas.length) {
      list.innerHTML += `<div class="section-title rapidas">⚡ Rápidas</div>`;
      rapidas.forEach((s, i) => list.innerHTML += cardHTML(s, i+1));
    }

  } else {
    data.forEach(s => list.innerHTML += cardHTML(s));
  }
}

function cardHTML(s, num=null) {
  return `
    <div class="card ${s.tipo}">
      <img class="thumb" src="${getThumbnail(s.link)}">
      <div class="info">
        <div class="title">${num ? num+". " : ""}${s.name}</div>
        <div class="sub">🎸 ${s.tono || "-"}</div>
      </div>
      <button class="play" onclick="playSong('${s.link}', this)">▶</button>
    </div>
  `;
}

function applyFilters() {
  const text = document.getElementById("search").value.toLowerCase();

  let filtered = songs.filter(s =>
    s.name.toLowerCase().includes(text) ||
    (s.tono && s.tono.toLowerCase().includes(text))
  );

  if (currentFilter === "semanal") {
    filtered = filtered.filter(s => s.ra);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(s => s.tipo === currentFilter);
  }

  render(filtered);
}

function setFilter(type, btn) {
  currentFilter = type;

  document.querySelectorAll(".filter-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  applyFilters();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertorio</title>

<style>

/* ===== BASE ===== */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  background: #0d1117;
  overflow-x: hidden;
}

body {
  background: radial-gradient(circle at top, #1f2937, #0d1117);
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;

  background: rgba(13, 17, 23, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(255,255,255,0.08);

  transition: all 0.3s ease;
}

.header-inner {
  max-width: 800px;
  margin: auto;
  padding: 14px;
  transition: all 0.3s ease;
}

.header.compact .header-inner {
  padding: 6px 12px;
}

h1 {
  text-align: center;
  margin: 6px 0 10px;
  font-size: 18px;
  transition: 0.3s;
}

.header.compact h1 {
  font-size: 14px;
  margin: 4px 0;
}

/* ===== BUSCADOR ===== */
#search {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

/* ===== BOTONES ===== */
.filters {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.filter-btn {
  flex: 1;
  padding: 10px;
  border-radius: 999px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: white;
}

.active {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

/* ===== CONTENIDO ===== */
.container {
  max-width: 800px;
  margin: auto;
  padding: 14px;
  padding-top: 170px;
}

/* ===== TITULOS ===== */
.section-title {
  margin: 24px 0 12px;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 12px;
  display: inline-block;
  background: rgba(255,255,255,0.05);
}

.lentas { color: #60a5fa; }
.rapidas { color: #fbbf24; }

/* ===== CARD ===== */
.card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 10px;

  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
}

.thumb {
  width: 75px;
  height: 52px;
  border-radius: 10px;
  object-fit: cover;
}

.info {
  flex: 1;
  min-width: 0;
}

.title {
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub {
  font-size: 12px;
  opacity: 0.8;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ===== BOTONES ===== */
.badge {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  cursor: pointer;
}

/* ===== PLAY ===== */
button.play {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  padding: 8px 10px;
  border-radius: 10px;
  color: white;
}

/* ===== MODAL FULLSCREEN ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  z-index: 2000;
}

.modal-content {
  width: 100%;
  height: 100%;
  padding: 16px;
  background: #0b0f1a;

  white-space: pre-wrap;
  font-family: monospace;

  font-size: 16px;
  overflow: auto;

  transform-origin: center;
}

</style>
</head>

<body>

<div class="header" id="header">
  <div class="header-inner">

    <h1>🎧 Repertorio</h1>

    <input id="search" placeholder="Buscar canciones..." onkeyup="applyFilters()">

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('semanal', this)">🔥 Mes</button>
      <button class="filter-btn" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('lenta', this)">🎶 Lentas</button>
      <button class="filter-btn" onclick="setFilter('rapida', this)">⚡ Rápidas</button>
    </div>

  </div>
</div>

<div class="container">
  <div id="list"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" id="modalText"></div>
</div>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6QgrmaVQhta8eiWVbG0Ts3DMnWaRfvgUyivmI-2Xrh2UyGgqWg02oC6jKXyOHX9DZsvDHls8oUb8d/pub?gid=0&single=true&output=csv";

let songs = [];
let currentFilter = "semanal";

fetch(URL)
.then(r => r.text())
.then(data => {

  const rows = data.split("\n").slice(1);

  songs = rows.map(row => {
    const [name, link, tono, tipo, ra, acordes] = row.split(",");

    return {
      name,
      link,
      tono,
      tipo: (tipo || "").trim() === "1" ? "lenta" :
            (tipo || "").trim() === "2" ? "rapida" : "",
      ra: (ra || "").trim() === "1",
      acordes: acordes || ""
    };
  }).filter(s => s.name);

  applyFilters();
});

window.addEventListener("scroll", () => {
  const header = document.getElementById("header");
  header.classList.toggle("compact", window.scrollY > 40);
});

function getYouTubeID(url) {
  const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const m = url.match(reg);
  return m ? m[1] : null;
}

function thumb(url) {
  const id = getYouTubeID(url);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}

/* ===== MODAL ===== */
function openModal(text) {
  document.getElementById("modalText").innerText =
    decodeURIComponent(text);
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* ===== RENDER ===== */
function render(data) {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const lentas = data.filter(s => s.tipo === "lenta");
  const rapidas = data.filter(s => s.tipo === "rapida");

  if (lentas.length) {
    list.innerHTML += `<div class="section-title lentas">🎶 Lentas</div>`;
    lentas.forEach((s,i)=>list.innerHTML += card(s,i+1));
  }

  if (rapidas.length) {
    list.innerHTML += `<div class="section-title rapidas">⚡ Rápidas</div>`;
    rapidas.forEach((s,i)=>list.innerHTML += card(s,i+1));
  }
}

/* ===== CARD ===== */
function card(s,i=null) {

  let acordeBtn = "";

  if (s.acordes && s.acordes.trim() !== "") {
    acordeBtn = `<span class="badge"
      onclick="openModal('${encodeURIComponent(s.acordes)}')">🎸 Ver acordes</span>`;
  }

  return `
    <div class="card">
      <img class="thumb" src="${thumb(s.link)}">

      <div class="info">
        <div class="title">${i?i+". ":""}${s.name}</div>

        <div class="sub">
          🎵 ${s.tono || "-"}
          ${acordeBtn}
        </div>
      </div>

      <button class="play" onclick="window.open('${s.link}')">▶</button>
    </div>
  `;
}

/* ===== FILTERS ===== */
function applyFilters() {

  const text = document.getElementById("search").value.toLowerCase();

  let filtered = songs.filter(s =>
    s.name.toLowerCase().includes(text) ||
    (s.tono && s.tono.toLowerCase().includes(text))
  );

  if (currentFilter === "semanal") {
    filtered = filtered.filter(s => s.ra);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(s => s.tipo === currentFilter);
  }

  render(filtered);
}

function setFilter(type, btn) {
  currentFilter = type;

  document.querySelectorAll(".filter-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  applyFilters();
}

</script>

</body>
</html>

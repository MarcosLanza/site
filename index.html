<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertorio</title>

<style>

/* ===== BASE MOBILE FIX ===== */
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  background: #0d1117;
}

body {
  background: radial-gradient(circle at top, #1f2937, #0d1117);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

html {
  background: #0d1117;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;

  background: rgba(13, 17, 23, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header-inner {
  max-width: 800px;
  margin: auto;
  padding: 12px 18px;
}

/* ===== CONTENIDO ===== */
.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
  padding-top: 170px;
  padding-bottom: 120px; /* 🔥 espacio para player */
}

/* ===== INPUT ===== */
#search {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: white;
  outline: none;
}

/* ===== BOTONES ===== */
.filters {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.filter-btn {
  flex: 1;
  padding: 10px;
  border-radius: 999px;
  border: none;
  background: rgba(255,255,255,0.06);
  color: white;
}

.active {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

/* ===== SECCIONES ===== */
.section-title {
  margin: 24px 0 12px;
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 10px;

  display: inline-block;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
}

.lentas {
  background: rgba(59,130,246,0.12);
  color: #60a5fa;
}

.rapidas {
  background: rgba(245,158,11,0.12);
  color: #fbbf24;
}

/* ===== CARD ===== */
.card {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px;
  margin-bottom: 10px;

  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
}

.thumb {
  width: 80px;
  height: 55px;
  border-radius: 10px;
  object-fit: cover;
}

.info {
  flex: 1;
}

.title {
  font-weight: 600;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

button.play {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  padding: 10px;
  border-radius: 10px;
  color: white;
}

/* ===== MINI PLAYER ===== */
.player {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;

  background: rgba(13, 17, 23, 0.95);
  backdrop-filter: blur(14px);

  border-top: 1px solid rgba(255,255,255,0.08);

  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px 14px;
  z-index: 2000;
}

.player img {
  width: 50px;
  height: 50px;
  border-radius: 8px;
  object-fit: cover;
}

.player-info {
  flex: 1;
}

.player-title {
  font-size: 13px;
  font-weight: 600;
}

.player-sub {
  font-size: 11px;
  opacity: 0.7;
}

.player button {
  background: #22c55e;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  color: white;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">

    <h3 style="text-align:center;margin:6px 0;">🎧 Repertorio</h3>

    <input id="search" placeholder="Buscar..." onkeyup="applyFilters()">

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('semanal', this)">🔥 Mes</button>
      <button class="filter-btn" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('lenta', this)">🎶 Lentas</button>
      <button class="filter-btn" onclick="setFilter('rapida', this)">⚡ Rápidas</button>
    </div>

  </div>
</div>

<!-- LISTA -->
<div class="container">
  <div id="list"></div>
</div>

<!-- MINI PLAYER -->
<div class="player" id="player" style="display:none;">
  <img id="pimg">
  <div class="player-info">
    <div class="player-title" id="ptitle">-</div>
    <div class="player-sub" id="psub">Reproduciendo</div>
  </div>
  <button onclick="stopPlayer()">⏹</button>
</div>

<script>

const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6QgrmaVQhta8eiWVbG0Ts3DMnWaRfvgUyivmI-2Xrh2UyGgqWg02oC6jKXyOHX9DZsvDHls8oUb8d/pub?gid=0&single=true&output=csv";

let songs = [];
let currentFilter = "semanal";

let currentSong = null;

fetch(URL)
.then(r => r.text())
.then(data => {

  const rows = data.split("\n").slice(1);

  songs = rows.map(row => {
    const [name, link, tono, tipo, ra] = row.split(",");

    return {
      name,
      link,
      tono,
      tipo: (tipo || "").trim() === "1" ? "lenta" :
            (tipo || "").trim() === "2" ? "rapida" : "",
      ra: (ra || "").trim() === "1"
    };
  }).filter(s => s.name);

  applyFilters();
});

function getYouTubeID(url) {
  const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const m = url.match(reg);
  return m ? m[1] : null;
}

function thumb(url) {
  const id = getYouTubeID(url);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}

/* ===== PLAYER ===== */
function playSong(song) {

  currentSong = song;

  document.getElementById("player").style.display = "flex";
  document.getElementById("pimg").src = thumb(song.link);
  document.getElementById("ptitle").innerText = song.name;

  window.open(song.link);
}

function stopPlayer() {
  document.getElementById("player").style.display = "none";
  currentSong = null;
}

/* ===== RENDER ===== */
function render(data) {

  const list = document.getElementById("list");
  list.innerHTML = "";

  const lentas = data.filter(s => s.tipo === "lenta");
  const rapidas = data.filter(s => s.tipo === "rapida");

  if (lentas.length) {
    list.innerHTML += `<div class="section-title lentas">🎶 Lentas</div>`;
    lentas.forEach((s,i)=>list.innerHTML += card(s,i+1));
  }

  if (rapidas.length) {
    list.innerHTML += `<div class="section-title rapidas">⚡ Rápidas</div>`;
    rapidas.forEach((s,i)=>list.innerHTML += card(s,i+1));
  }
}

function card(s, i=null) {
  return `
    <div class="card">
      <img class="thumb" src="${thumb(s.link)}">
      <div class="info">
        <div class="title">${i?i+". ":""}${s.name}</div>
        <div class="sub">🎸 ${s.tono || "-"}</div>
      </div>
      <button class="play" onclick='playSong(${JSON.stringify(s)})'>▶</button>
    </div>
  `;
}

/* ===== FILTERS ===== */
function applyFilters() {

  const text = document.getElementById("search").value.toLowerCase();

  let filtered = songs.filter(s =>
    s.name.toLowerCase().includes(text) ||
    (s.tono && s.tono.toLowerCase().includes(text))
  );

  if (currentFilter === "semanal") {
    filtered = filtered.filter(s => s.ra);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(s => s.tipo === currentFilter);
  }

  render(filtered);
}

function setFilter(type, btn) {

  currentFilter = type;

  document.querySelectorAll(".filter-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  applyFilters();
}

</script>

</body>
</html>

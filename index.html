<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertorio</title>

<style>

/* ===== BASE ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  background: #0d1117;
}

/* fondo suave tipo app */
body {
  background: radial-gradient(circle at top, #1f2937, #0d1117);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;

  /* 🔥 GLASS EFFECT (lo que te gustaba) */
  background: rgba(13, 17, 23, 0.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header-inner {
  max-width: 800px;
  margin: auto;
  padding: 12px 18px;
}

/* ===== CONTENIDO ===== */
.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
  padding-top: 160px;
}

/* título */
h1 {
  text-align: center;
  margin: 10px 0 15px;
}

/* buscador */
#search {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;

  background: rgba(255,255,255,0.06);
  color: white;
  outline: none;
}

/* botones */
.filters {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.filter-btn {
  flex: 1;
  padding: 10px;
  border-radius: 999px;
  border: none;

  background: rgba(255,255,255,0.06);
  color: white;
}

.active {
  background: linear-gradient(135deg, #22c55e, #16a34a);
}

/* ===== SECCIONES (MEJOR ESPACIADO) ===== */
.section-title {
  margin: 28px 0 14px;   /* 🔥 MÁS AIRE ARRIBA */
  font-size: 13px;
  padding: 8px 12px;

  border-radius: 10px;
  display: inline-block;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255,255,255,0.08);
}

/* estilos suaves */
.lentas {
  background: rgba(59,130,246,0.12);
  color: #60a5fa;
}

.rapidas {
  background: rgba(245,158,11,0.12);
  color: #fbbf24;
}

/* ===== CARDS ===== */
.card {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px;
  margin-bottom: 10px;

  border-radius: 14px;

  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
}

.thumb {
  width: 80px;
  height: 55px;
  border-radius: 10px;
  object-fit: cover;
}

.info {
  flex: 1;
}

.title {
  font-weight: 600;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

button.play {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border: none;
  padding: 10px;
  border-radius: 10px;
  color: white;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">

    <h1>🎧 Repertorio Jóvenes</h1>

    <input id="search" placeholder="Buscar..." onkeyup="applyFilters()">

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('semanal', this)">🔥 Este Mes</button>
      <button class="filter-btn" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('lenta', this)">🎶 Lentas</button>
      <button class="filter-btn" onclick="setFilter('rapida', this)">⚡ Rápidas</button>
    </div>

  </div>
</div>

<!-- CONTENIDO -->
<div class="container">
  <div id="list"></div>
</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6QgrmaVQhta8eiWVbG0Ts3DMnWaRfvgUyivmI-2Xrh2UyGgqWg02oC6jKXyOHX9DZsvDHls8oUb8d/pub?gid=0&single=true&output=csv";

let songs = [];
let currentFilter = "semanal";

fetch(URL)
  .then(r => r.text())
  .then(data => {
    const rows = data.split("\n").slice(1);

    songs = rows.map(row => {
      const [name, link, tono, tipo, ra] = row.split(",");

      return {
        name,
        link,
        tono,
        tipo: (tipo || "").trim() === "1" ? "lenta" :
              (tipo || "").trim() === "2" ? "rapida" : "",
        ra: (ra || "").trim() === "1"
      };
    }).filter(s => s.name);

    applyFilters();
  });

function getYouTubeID(url) {
  const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const m = url.match(reg);
  return m ? m[1] : null;
}

function getThumbnail(url) {
  const id = getYouTubeID(url);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}

function playSong(link, btn) {
  window.open(link);
}

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const lentas = data.filter(s => s.tipo === "lenta");
  const rapidas = data.filter(s => s.tipo === "rapida");

  if (lentas.length) {
    list.innerHTML += `<div class="section-title lentas">🎶 Lentas</div>`;
    lentas.forEach((s, i) => list.innerHTML += cardHTML(s, i+1));
  }

  if (rapidas.length) {
    list.innerHTML += `<div class="section-title rapidas">⚡ Rápidas</div>`;
    rapidas.forEach((s, i) => list.innerHTML += cardHTML(s, i+1));
  }
}

function cardHTML(s, num=null) {
  return `
    <div class="card ${s.tipo}">
      <img class="thumb" src="${getThumbnail(s.link)}">
      <div class="info">
        <div class="title">${num ? num+". " : ""}${s.name}</div>
        <div class="sub">🎸 ${s.tono || "-"}</div>
      </div>
      <button class="play" onclick="playSong('${s.link}', this)">▶</button>
    </div>
  `;
}

function applyFilters() {
  const text = document.getElementById("search").value.toLowerCase();

  let filtered = songs.filter(s =>
    s.name.toLowerCase().includes(text) ||
    (s.tono && s.tono.toLowerCase().includes(text))
  );

  if (currentFilter === "semanal") {
    filtered = filtered.filter(s => s.ra);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(s => s.tipo === currentFilter);
  }

  render(filtered);
}

function setFilter(type, btn) {
  currentFilter = type;

  document.querySelectorAll(".filter-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");

  applyFilters();
}
</script>

</body>
</html>
